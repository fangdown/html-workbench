server {
    listen 80;
    listen [::]:80;
    server_name zhili.opens.chat;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/ai-zhili;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://zhili.opens.chat$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhili.opens.chat;

    ssl_certificate /etc/letsencrypt/live/zhili.opens.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhili.opens.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    access_log /var/log/nginx/zhili.opens.chat.access.log;
    error_log /var/log/nginx/zhili.opens.chat.error.log;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
